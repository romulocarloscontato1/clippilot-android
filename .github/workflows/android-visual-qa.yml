name: Android Visual QA (real emulator screenshots)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QA run early (even if emulator fails)
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git ls-remote --exit-code --heads origin qa-snapshots >/dev/null; then
            git fetch origin qa-snapshots
            git checkout -B qa-snapshots origin/qa-snapshots
          else
            git checkout --orphan qa-snapshots
            git rm -rf . || true
          fi
          printf '{"run_id":%s,"source_commit":"%s","status":"starting"}\n' "${GITHUB_RUN_ID}" "${GITHUB_SHA}" > manifest.json
          git add manifest.json
          git commit -m "qa: register emulator run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:qa-snapshots
          git checkout -f "${GITHUB_SHA}"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (without obsolete tools package)
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Generate three local MP4 fixtures for actual playback testing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/fixtures
          command -v ffmpeg
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=360x640:rate=24:duration=2" -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=2" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest qa/fixtures/qa-1.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "smptebars=size=360x640:rate=24:duration=2" -f lavfi -i "sine=frequency=550:sample_rate=44100:duration=2" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest qa/fixtures/qa-2.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=0x0d4681:size=360x640:rate=24:duration=2" -f lavfi -i "sine=frequency=660:sample_rate=44100:duration=2" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest qa/fixtures/qa-3.mp4
          ls -lh qa/fixtures/*.mp4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Android and capture real pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -e
            mkdir -p qa/screenshots
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 0 || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.clippilot.android || true
            adb shell am start -W -n com.clippilot.android/.MainActivity
            sleep 6
            adb exec-out screencap -p > qa/screenshots/01-home-real.png
            test -s qa/screenshots/01-home-real.png
            adb shell uiautomator dump /sdcard/clippilot-ui.xml || true
            adb pull /sdcard/clippilot-ui.xml qa/screenshots/01-ui.xml || true
            # Tap the real button using its accessibility bounds. This survives changes
            # in DPI, status bar height and screen dimensions.
            tap_by_label() {
              label="$1"
              adb shell uiautomator dump /sdcard/qa-window.xml > /dev/null
              adb exec-out cat /sdcard/qa-window.xml > /tmp/qa-window.xml
              coordinates=$(python3 -c 'import sys,re,xml.etree.ElementTree as ET; target=sys.argv[1]; nodes=(n for n in ET.parse("/tmp/qa-window.xml").iter("node") if n.get("text")==target or n.get("content-desc")==target); n=next(nodes); a,b,c,d=map(int,re.findall("[0-9]+",n.get("bounds",""))); print((a+c)//2,(b+d)//2)' "$label")
              adb shell input tap $coordinates
              sleep 3
            }

            tap_by_label "Novo projeto"
            adb exec-out screencap -p > qa/screenshots/02-new-project-real.png
            test -s qa/screenshots/02-new-project-real.png
            adb shell uiautomator dump /sdcard/clippilot-create-ui.xml || true
            adb pull /sdcard/clippilot-create-ui.xml qa/screenshots/02-ui.xml || true

            # Put three reproducible MP4 files inside the real debug APK sandbox,
            # then populate the same SharedPreferences used for imported projects.
            # This tests real thumbnail decoding and ExoPlayer playback without
            # any fabricated or post-processed UI screenshot.
            adb shell run-as com.clippilot.android mkdir -p files shared_prefs
            for i in 1 2 3; do
              adb exec-in run-as com.clippilot.android sh -c "cat > files/qa-$i.mp4" < "qa/fixtures/qa-$i.mp4"
            done
            cat > /tmp/qa-project.xml <<'EOF'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map>
              <string name="clips">["file:///data/user/0/com.clippilot.android/files/qa-1.mp4","file:///data/user/0/com.clippilot.android/files/qa-2.mp4","file:///data/user/0/com.clippilot.android/files/qa-3.mp4"]</string>
              <string name="name">Maya - Episódio 04</string>
            </map>
            EOF
            adb exec-in run-as com.clippilot.android sh -c 'cat > shared_prefs/clippilot-project.xml' < /tmp/qa-project.xml
            adb shell am force-stop com.clippilot.android
            adb shell am start -W -n com.clippilot.android/.MainActivity
            sleep 5
            adb exec-out screencap -p > qa/screenshots/03-home-with-clips-real.png
            test -s qa/screenshots/03-home-with-clips-real.png

            tap_by_label "Novo projeto"
            adb exec-out screencap -p > qa/screenshots/04-project-loaded-real.png
            test -s qa/screenshots/04-project-loaded-real.png
            # Check that the real app recognizes all three fixture videos.
            adb shell uiautomator dump /sdcard/qa-clips-ui.xml >/dev/null
            adb exec-out cat /sdcard/qa-clips-ui.xml > qa/screenshots/04-clips-ui.xml
            grep -q 'Clipe 3' qa/screenshots/04-clips-ui.xml

            # The continue button is sticky. Open actual single-clip playback.
            tap_by_label "Continuar →"
            sleep 3
            adb exec-out screencap -p > qa/screenshots/05-preview-real.png
            test -s qa/screenshots/05-preview-real.png

            tap_by_label "Exportações"
            adb exec-out screencap -p > qa/screenshots/06-exports-real.png
            test -s qa/screenshots/06-exports-real.png

            adb logcat -d -t 2000 > qa/screenshots/emulator-logcat.txt || true
            file qa/screenshots/*.png

      - name: Upload real emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipPilot-real-emulator-screenshots
          path: qa/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish real screenshots to qa-snapshots branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/clippilot-qa"
          cp qa/screenshots/*.png "${RUNNER_TEMP}/clippilot-qa/"
          cat > "${RUNNER_TEMP}/clippilot-qa/manifest.json" <<EOF
          {"run_id": ${GITHUB_RUN_ID}, "source_commit": "${GITHUB_SHA}", "capture": "Android 35 emulator adb screencap -p", "screens": ["01-home-real.png", "02-new-project-real.png", "03-home-with-clips-real.png", "04-project-loaded-real.png", "05-preview-real.png", "06-exports-real.png"]}
          EOF
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git ls-remote --exit-code --heads origin qa-snapshots >/dev/null; then
            git fetch origin qa-snapshots
            git checkout -B qa-snapshots origin/qa-snapshots
          else
            git checkout --orphan qa-snapshots
            git rm -rf . || true
          fi
          mkdir -p screenshots
          cp "${RUNNER_TEMP}/clippilot-qa/"*.png screenshots/
          cp "${RUNNER_TEMP}/clippilot-qa/manifest.json" manifest.json
          git add screenshots manifest.json
          git commit -m "qa: real Android emulator screenshots from run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:qa-snapshots
