name: Android Visual QA (real emulator screenshots)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (without obsolete tools package)
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Android and capture real pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -e
            mkdir -p qa/screenshots
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 0 || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.clippilot.android || true
            adb shell am start -W -n com.clippilot.android/.MainActivity
            sleep 6
            adb shell screencap -p /sdcard/clippilot_home.png
            adb pull /sdcard/clippilot_home.png qa/screenshots/01-home-real.png
            adb shell uiautomator dump /sdcard/clippilot-ui.xml || true
            adb pull /sdcard/clippilot-ui.xml qa/screenshots/01-ui.xml || true
            adb shell input tap 665 1800
            sleep 3
            adb shell screencap -p /sdcard/clippilot_create.png
            adb pull /sdcard/clippilot_create.png qa/screenshots/02-new-project-real.png
            adb shell uiautomator dump /sdcard/clippilot-create-ui.xml || true
            adb pull /sdcard/clippilot-create-ui.xml qa/screenshots/02-ui.xml || true
            adb logcat -d -t 2000 > qa/screenshots/emulator-logcat.txt || true
            file qa/screenshots/*.png

      - name: Upload real emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipPilot-real-emulator-screenshots
          path: qa/screenshots/
          if-no-files-found: warn
          retention-days: 14
